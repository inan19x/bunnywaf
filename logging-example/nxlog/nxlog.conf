<Input iis_log>
	Module		im_file
	File		"C:\\path\\to\\iis.log
	SavePos		TRUE
	ReadFromLast	TRUE
</Input>

<Output remote_syslog>
	Module		om_tcp
	Host		<SYSLOG_HOST>
	Port		514
	Exec $SourceName = 'BunnyWAF';
	Exec		to_syslog_bsd();
</Output>

<Route iis_to_syslog>
	Path		iis_log => remote_syslog
</Route>
